name: Build Aria Reply V30

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Build release
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "${ARIA_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ARIA_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > keystore/aria-release.jks
            ./gradlew assembleRelease --no-daemon
          else
            echo "No release keystore secret configured; generating an ephemeral CI key."
            keytool -genkeypair -alias aria -keyalg RSA -keysize 2048 -validity 3650 \
              -keystore keystore/aria-release.jks -storepass changeit -keypass changeit \
              -dname "CN=Aria V30,O=Aria,C=IN" -noprompt
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/aria-reply-native/keystore/aria-release.jks" \
              -Pandroid.injected.signing.store.password=changeit \
              -Pandroid.injected.signing.key.alias=aria \
              -Pandroid.injected.signing.key.password=changeit
          fi

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v30
          path: |
            aria-reply-native/app/build/outputs/apk/debug/*.apk
            aria-reply-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
