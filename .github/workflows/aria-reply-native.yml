name: Build Aria Reply V25

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$ARIA_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > keystore/aria-release.jks
          test -s keystore/aria-release.jks
          echo "Keystore restored."

      - name: Verify release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore keystore/aria-release.jks \
            -storepass "$ARIA_KEYSTORE_PASSWORD" \
            -alias "$ARIA_KEY_ALIAS" \
            >/dev/null
          echo "Keystore validation passed."

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Build release APK
        shell: bash
        env:
          ARIA_KEYSTORE_FILE: ${{ github.workspace }}/aria-reply-native/keystore/aria-release.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "Release APK generated successfully."
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v25-signed
          path: aria-reply-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
