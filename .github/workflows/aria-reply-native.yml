name: Build Aria Reply V30

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$ARIA_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > keystore/aria-release.jks
          test -s keystore/aria-release.jks
          echo "Keystore restored."

      - name: Verify release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore keystore/aria-release.jks \
            -storepass "$ARIA_KEYSTORE_PASSWORD" \
            -alias "$ARIA_KEY_ALIAS" \
            >/dev/null
          echo "Keystore validation passed."

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Build release APK
        shell: bash
        env:
          ARIA_KEYSTORE_FILE: ${{ github.workspace }}/aria-reply-native/keystore/aria-release.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "===== GRADLE VERSION ====="
          ./gradlew --version

          echo "===== BUILD RELEASE ====="
          ./gradlew clean assembleRelease --no-daemon --console=plain

          echo "===== LOCATE APK ====="
          find app/build/outputs -type f -name "*.apk" -print

          APK="$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          test -s "$APK"

          echo "Release APK generated successfully:"
          ls -lh "$APK"

          mkdir -p release
          cp "$APK" release/aria-reply-native-v30-signed.apk

          echo "===== APK INTEGRITY ====="
          unzip -t "$APK"

          echo "===== APK SIGNATURE ====="
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "===== APK BADGING ====="
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          fi
          "$AAPT" dump badging "$APK" | head -30

          echo "===== MANIFEST ICON ====="
          grep -R 'android:icon\|android:roundIcon' app/src/main/AndroidManifest.xml || true

          echo "===== ICON FILES ====="
          find app/src/main/res -type f | grep -E 'ic_launcher|launcher' | sort || true

          echo "===== FINAL ARTIFACT ====="
          test -s release/aria-reply-native-v30-signed.apk
          ls -lh release/aria-reply-native-v30-signed.apk
          echo "BUILD_STEP_OK=1"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v30-signed
          path: aria-reply-native/release/aria-reply-native-v30-signed.apk
          if-no-files-found: error
