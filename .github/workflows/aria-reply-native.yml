name: Build Aria Reply V12

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p keystore

          printf '%s' "$ARIA_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > keystore/aria-release.jks

          test -s keystore/aria-release.jks

          echo "Keystore restored successfully."

      - name: Verify release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore keystore/aria-release.jks \
            -storepass "$ARIA_KEYSTORE_PASSWORD" \
            -alias "$ARIA_KEY_ALIAS" \
            >/dev/null

          echo "Keystore validation passed."

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Build signed release APK
        shell: bash
        env:
          ARIA_KEYSTORE_FILE: keystore/aria-release.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew clean assembleRelease --no-daemon

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "Release APK generated successfully."
          ls -lh "$APK"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          test -x "$APKSIGNER"

          echo "Using apksigner: $APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verification passed."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v12-signed
          path: aria-reply-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
