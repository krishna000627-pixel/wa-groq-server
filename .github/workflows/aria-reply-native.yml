name: Build Aria Reply V11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$ARIA_KEYSTORE_BASE64" | base64 --decode > keystore/aria-release.jks
          test -s keystore/aria-release.jks

      - name: Verify release keystore
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore keystore/aria-release.jks \
            -storepass "$ARIA_KEYSTORE_PASSWORD" \
            -alias "$ARIA_KEY_ALIAS" >/dev/null

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build signed release APK
        env:
          ARIA_KEYSTORE_FILE: keystore/aria-release.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Sign release APK
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          KS="keystore/aria-release.jks"

          test -s "$APK"
          test -s "$KS"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"

          echo "=== VERIFY KEYSTORE ==="
          keytool -list             -keystore "$KS"             -storepass "$ARIA_KEYSTORE_PASSWORD"             -alias "$ARIA_KEY_ALIAS"

          echo "=== SIGN APK ==="
          "$APKSIGNER" sign             --ks "$KS"             --ks-pass "env:ARIA_KEYSTORE_PASSWORD"             --ks-key-alias "$ARIA_KEY_ALIAS"             --key-pass "env:ARIA_KEYSTORE_PASSWORD"             "$APK"

          echo "=== VERIFY APK ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Sign release APK
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"

          "$APKSIGNER" sign             --ks keystore/aria-release.jks             --ks-pass env:ARIA_KEYSTORE_PASSWORD             --ks-key-alias "$ARIA_KEY_ALIAS"             --key-pass env:ARIA_KEY_PASSWORD             "$APK"

      - name: Verify signed APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v11-signed
          path: aria-reply-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
