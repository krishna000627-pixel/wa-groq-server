name: Build Aria Reply V11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Verify release keystore
        run: |
          test -f keystore/aria-release.jks
          keytool -list \
            -keystore keystore/aria-release.jks \
            -storepass "$ARIA_KEYSTORE_PASSWORD" \
            -alias "$ARIA_KEY_ALIAS" >/dev/null
        env:
          ARIA_KEYSTORE_PASSWORD: 'M6sbMt7Y32asaB7lcH2zEhyV-6G1waw9'
          ARIA_KEY_ALIAS: 'aria-release'

      - name: Build signed release APK
        env:
          ARIA_KEYSTORE_PASSWORD: 'M6sbMt7Y32asaB7lcH2zEhyV-6G1waw9'
          ARIA_KEY_ALIAS: 'aria-release'
          ARIA_KEY_PASSWORD: 'M6sbMt7Y32asaB7lcH2zEhyV-6G1waw9'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v11-release
          path: aria-reply-native/app/build/outputs/apk/release/*.apk
