name: Build Aria Reply V11

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aria-reply-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p keystore

          printf '%s' "$ARIA_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > keystore/aria-release.jks

          test -s keystore/aria-release.jks

          echo "Keystore restored."

      - name: Verify release keystore
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore keystore/aria-release.jks \
            -storepass "$ARIA_KEYSTORE_PASSWORD" \
            -alias "$ARIA_KEY_ALIAS" \
            >/dev/null

          echo "Keystore validation passed."

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Build release APK
        shell: bash
        env:
          ARIA_KEYSTORE_FILE: ${{ github.workspace }}/aria-reply-native/keystore/aria-release.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew clean assembleRelease --no-daemon

          echo "===== APK OUTPUTS ====="
          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found release APK: $APK"

      - name: Sign release APK
        shell: bash
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KS="keystore/aria-release.jks"

          test -s "$KS"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)"

          test -x "$APKSIGNER"

          echo "Using apksigner: $APKSIGNER"
          echo "Signing: $APK"

          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-pass "env:ARIA_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ARIA_KEY_ALIAS" \
            --key-pass "env:ARIA_KEY_PASSWORD" \
            "$APK"

          echo "Signing completed."

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)"

          test -x "$APKSIGNER"

          echo "===== VERIFY SIGNATURE ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verification passed."

      - name: Normalize APK name
        shell: bash
        run: |
          set -euo pipefail

          FINAL="app/build/outputs/apk/release/aria-reply-native-v11-signed.apk"

          cp "$APK" "$FINAL"

          test -s "$FINAL"

          echo "Final APK:"
          ls -lh "$FINAL"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-reply-native-v11-signed
          path: aria-reply-native/app/build/outputs/apk/release/aria-reply-native-v11-signed.apk
          if-no-files-found: error
