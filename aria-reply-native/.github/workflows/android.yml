name: Build Aria Native V12
on: {push: {branches: [main, master]}, workflow_dispatch: {}}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: aria-reply-native}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: aria-native-v12-release, path: aria-reply-native/app/build/outputs/apk/release/*.apk}