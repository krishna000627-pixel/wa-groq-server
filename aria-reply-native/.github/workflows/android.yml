name: Aria Native Release

on:
  push:
    branches: [main, master]
    paths:
      - 'aria-reply-native/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aria-reply-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing keystore when configured
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ci-keystore
          if [ -n "${ARIA_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ARIA_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > ci-keystore/aria-release.jks
            test -s ci-keystore/aria-release.jks
            keytool -list -keystore ci-keystore/aria-release.jks -storepass "$ARIA_KEYSTORE_PASSWORD" -alias "$ARIA_KEY_ALIAS" >/dev/null
            echo "ARIA_KEYSTORE_FILE=$GITHUB_WORKSPACE/aria-reply-native/ci-keystore/aria-release.jks" >> "$GITHUB_ENV"
            echo "Signing keystore validated."
          else
            echo "No signing secret configured; release artifact will be unsigned."
          fi

      - name: Build release
        env:
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ARIA_KEYSTORE_FILE:-}" ]; then
            gradle :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify --verbose "$APK"; then
            echo "APK signature verification passed."
          else
            echo "APK is unsigned; this is expected when signing secrets are not configured."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-native-v20-release
          path: aria-reply-native/app/build/outputs/apk/release/app-release.apk
